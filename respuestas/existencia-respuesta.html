<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>existencia ... respuesta1</title>
    <!-- Conectamos al CSS del proyecto principal usando ../ -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="contenedor-blog">
    <h1>existencia ... respuesta1</h1>

    <!-- Controles de accesibilidad (reutilizados) -->
    <div class="controles-letra">
        <div class="grupo-control">
            <span>Tamaño:</span>
            <button id="btn-aumentar" class="btn-acc" title="Aumentar letra">A+</button>
            <button id="btn-disminuir" class="btn-acc" title="Disminuir letra">A-</button>
        </div>
        <div class="grupo-control">
            <span>Tema:</span>
            <button class="btn-acc btn-tema" data-tema="claro" title="Tema Claro">☀️</button>
            <button class="btn-acc btn-tema" data-tema="sepia" title="Tema Sepia">📜</button>
            <button class="btn-acc btn-tema" data-tema="oscuro" title="Tema Oscuro">🌙</button>
        </div>        
    </div>

        <!-- Reproductor de Audio (Opcional) -->
        <div class="audio-container" id="zona-audio" style=" margin-bottom: 20px;">
            <p style="font-weight: bold; margin-bottom: 5px;">🎧 Escuchar esta reflexión:</p>
            <audio controls style="width: 100%;">
                <source src="https://archive.org/download/audios-musica-y-reflexion/reflex1.mp3" type="audio/mpeg">
                Tu navegador no soporta el elemento de audio.
            </audio>
        </div>
    
    <!-- Aquí va el texto de la reflexión -->
    <div id="video-reflexion" class="entrada">
        <p>1 existencia ... respuesta1<br>2 existencia ... respuesta1<br>3 existencia ... respuesta1</p>
        
    </div>

    <!-- Botón de Compartir -->
    <button class="btn-compartir" id="btn-compartir-reflexion">➦ Compartir esta reflexión</button>

    <!-- Aquí el script inyectará el botón de "Volver" si se requiere -->
    

</div>

<footer>
    <p class="frase">"Compartiendo fe y esperanza"</p>
</footer>

<script>
// Lógica para el tamaño de la fuente (idéntica a la del blog)
let tamanoActual = 100; 
const tamanoGuardado = localStorage.getItem('tamanoFuente');
if (tamanoGuardado) {
    tamanoActual = parseInt(tamanoGuardado);
    document.body.style.fontSize = `${tamanoActual}%`;
}
document.getElementById('btn-aumentar').addEventListener('click', () => {
    if (tamanoActual < 150) { tamanoActual += 10; document.body.style.fontSize = `${tamanoActual}%`; localStorage.setItem('tamanoFuente', tamanoActual); }
});
document.getElementById('btn-disminuir').addEventListener('click', () => {
    if (tamanoActual > 80) { tamanoActual -= 10; document.body.style.fontSize = `${tamanoActual}%`; localStorage.setItem('tamanoFuente', tamanoActual); }
});

// Lógica para los temas (idéntica a la del blog)
const botonesTema = document.querySelectorAll('.btn-tema');
const temaGuardado = localStorage.getItem('temaColor');
if (temaGuardado && temaGuardado !== 'claro') { document.body.classList.add(`tema-${temaGuardado}`); }
botonesTema.forEach(boton => {
    boton.addEventListener('click', function() {
        const tema = this.getAttribute('data-tema');
        document.body.classList.remove('tema-oscuro', 'tema-sepia');
        if (tema !== 'claro') { document.body.classList.add(`tema-${tema}`); }
        localStorage.setItem('temaColor', tema);
    });
});

// Lógica para compartir la reflexión
document.getElementById('btn-compartir-reflexion').addEventListener('click', function() {
    const url = window.location.href; // Toma la URL exacta de esta página
    const titulo = document.title;
    const mensaje = `Te comparto esta reflexión: ${titulo}\n\nLéela aquí: ${url}`;
    window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(mensaje)}`, '_blank');
});
</script>

</body>
</html>
