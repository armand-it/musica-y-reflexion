<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Musica Canto Reflexion</title>
    <!-- Aquí conectamos el CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="contenedor-blog">
    <h1>Música, canto y más...</h1>

    <!-- Controles de accesibilidad -->
    <div class="controles-letra">
        <div class="grupo-control">
            <span>Tamaño:</span>
            <button id="btn-aumentar" class="btn-acc" title="Aumentar letra">A+</button>
            <button id="btn-disminuir" class="btn-acc" title="Disminuir letra">A-</button>
        </div>
        
        <div class="grupo-control">
            <span>Tema:</span>
            <button class="btn-acc btn-tema" data-tema="claro" title="Tema Claro">☀️</button>
            <button class="btn-acc btn-tema" data-tema="sepia" title="Tema Sepia">📜</button>
            <button class="btn-acc btn-tema" data-tema="oscuro" title="Tema Oscuro">🌙</button>
        </div>
    </div>

    <!-- Botón de prueba temporal -->
    <button onclick="abrirModal('respuestas/existencia-respuesta.html')" class="btn-compartir" style="background-color: #6c757d; margin-top: 10px;">Probar Modal (Temporal)</button>    

</div>

<footer>
    <p class="frase">"Cantad a Jehová cántico nuevo; cantad a Jehová, toda la tierra. Cantad a Jehová, bendecid su nombre; anunciad de día en día su salvación."</p>
    <p class="cita">Salmo 96:1-2</p>
</footer>

<!-- VENTANA FLOTANTE (MODAL) PARA REFLEXIONES -->
<div id="modal-reflexion" class="modal-oculto">
    <div class="modal-contenido">
        <button id="cerrar-modal" class="btn-cerrar" title="Cerrar ventana">✕</button>
        <iframe id="iframe-reflexion" src="" title="Reflexión"></iframe>
    </div>
</div>

<script>
document.querySelectorAll('.video-fachada').forEach(fachada => {
    fachada.addEventListener('click', function() {
        const idVideo = this.getAttribute('data-id');
        const titulo = this.getAttribute('data-titulo');
        
        // Creamos el iframe real de YouTube (sin autoplay para evitar bloqueos de audio)
        const iframe = document.createElement('iframe');
        iframe.setAttribute('src', `https://www.youtube-nocookie.com/embed/${idVideo}?rel=0&modestbranding=1&controls=1&showinfo=0&iv_load_policy=3&playsinline=1`);
        iframe.setAttribute('frameborder', '0');
        iframe.setAttribute('referrerpolicy', 'strict-origin-when-cross-origin');
        iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture');
        iframe.setAttribute('allowfullscreen', 'true');
        iframe.setAttribute('title', titulo);
        
        // Reemplazamos la imagen por el reproductor
        this.innerHTML = '';
        this.appendChild(iframe);
    });
});

// Lógica para el botón de compartir
document.querySelectorAll('.btn-compartir').forEach(boton => {
    boton.addEventListener('click', function() {
        // Busca la entrada del blog a la que pertenece este botón
        const entrada = this.closest('.entrada');
        const idVideo = entrada.id; 
        const titulo = entrada.querySelector('h2').innerText;
        
        // Arma el enlace exacto
       const url = `${window.location.origin}${window.location.pathname}#${idVideo}`;
        
        // Arma el mensaje con saltos de línea reales
        const mensaje = `🎵 Te comparto este canto: ${titulo}\n\nEscúchalo y lee la letra aquí: ${url}`;
        
        // Codifica el mensaje para que WhatsApp lo entienda perfectamente
        const mensajeCodificado = encodeURIComponent(mensaje);
        
        // Abre WhatsApp
        window.open(`https://api.whatsapp.com/send?text=${mensajeCodificado}`, '_blank');
    });
});

// Lógica para el tamaño de la fuente
let tamanoActual = 100; // 100%

// Recuperar el tamaño guardado si el usuario vuelve a entrar
const tamanoGuardado = localStorage.getItem('tamanoFuente');
if (tamanoGuardado) {
    tamanoActual = parseInt(tamanoGuardado);
    document.body.style.fontSize = `${tamanoActual}%`;
}

document.getElementById('btn-aumentar').addEventListener('click', () => {
    if (tamanoActual < 150) { // Límite máximo (150%)
        tamanoActual += 10;
        document.body.style.fontSize = `${tamanoActual}%`;
        localStorage.setItem('tamanoFuente', tamanoActual);
    }
});

document.getElementById('btn-disminuir').addEventListener('click', () => {
    if (tamanoActual > 80) { // Límite mínimo (80%)
        tamanoActual -= 10;
        document.body.style.fontSize = `${tamanoActual}%`;
        localStorage.setItem('tamanoFuente', tamanoActual);
    }
});


// Lógica para los Temas de Color
const botonesTema = document.querySelectorAll('.btn-tema');

// Recuperar el tema guardado
const temaGuardado = localStorage.getItem('temaColor');
if (temaGuardado && temaGuardado !== 'claro') {
    document.body.classList.add(`tema-${temaGuardado}`);
}

botonesTema.forEach(boton => {
    boton.addEventListener('click', function() {
        const tema = this.getAttribute('data-tema');
        
        // Limpiamos solo las clases de tema que pudieran existir
        document.body.classList.remove('tema-oscuro', 'tema-sepia');
        
        // Si el tema no es el claro (que es el default), le ponemos la clase
        if (tema !== 'claro') {
            document.body.classList.add(`tema-${tema}`);
        }
        
        // Guarda la preferencia en el navegador
        localStorage.setItem('temaColor', tema);
    });
});

// Lógica para abrir y cerrar el Modal de Reflexiones
const modal = document.getElementById('modal-reflexion');
const cerrarModalBtn = document.getElementById('cerrar-modal');
const iframeReflexion = document.getElementById('iframe-reflexion');

// Esta función la usaremos luego cuando creemos los botones "Saber más"
function abrirModal(urlReflexion) {
    iframeReflexion.src = urlReflexion; // Carga la página en el iframe
    modal.classList.remove('modal-oculto'); // Muestra la ventana
    
    // Opcional: Pausar el video de fondo (lo haremos luego)
}

// Cerrar con la "X"
cerrarModalBtn.addEventListener('click', function() {
    modal.classList.add('modal-oculto');
    iframeReflexion.src = ''; // Vacía el iframe para detener el audio
});

// Cerrar haciendo clic fuera de la caja (en la cortina oscura)
modal.addEventListener('click', function(e) {
    if (e.target === modal) {
        modal.classList.add('modal-oculto');
        iframeReflexion.src = '';
    }
});

</script>

</body>
</html>
